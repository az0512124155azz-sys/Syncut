name: Build Syncut Windows - Hardened Validation

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'syncut-source.part*'
      - '.github/workflows/build-syncut.yml'
      - 'installer.nsi'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 210

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source parts and reconstruct archive
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = @('syncut-source.part01','syncut-source.part02','syncut-source.part03')
          foreach ($part in $parts) {
            if (-not (Test-Path $part)) { throw "Missing $part" }
            $size = (Get-Item $part).Length
            if ($size -lt 1000000) { throw "$part is unexpectedly small: $size bytes" }
            Write-Host "$part = $size bytes"
          }
          cmd /c copy /b syncut-source.part01+syncut-source.part02+syncut-source.part03 syncut-source.zip
          if ($LASTEXITCODE -ne 0) { throw 'Failed to reconstruct syncut-source.zip' }
          if (-not (Test-Path syncut-source.zip)) { throw 'syncut-source.zip was not created' }

      - name: Validate and extract source archive
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path 'syncut-source.zip'))
          try {
            if ($zip.Entries.Count -lt 1000) { throw "Source archive has too few entries: $($zip.Entries.Count)" }
            if (-not ($zip.Entries.FullName -contains 'Syncut-Claude-Handoff/CMakeLists.txt')) {
              throw 'Root CMakeLists.txt is missing from source archive'
            }
            if (-not ($zip.Entries.FullName -contains 'Syncut-Claude-Handoff/src/syncut/aiassistantwidget.cpp')) {
              throw 'Syncut local AI source is missing from source archive'
            }
          } finally {
            $zip.Dispose()
          }

          if (Test-Path source) { Remove-Item source -Recurse -Force }
          Expand-Archive -LiteralPath syncut-source.zip -DestinationPath source -Force
          $src = 'source\Syncut-Claude-Handoff'
          if (-not (Test-Path "$src\CMakeLists.txt")) { throw 'Source extraction failed' }

          $meltBuilder = "$src\src\timeline2\model\builders\meltBuilder.cpp"
          if (Test-Path $meltBuilder) {
            $text = Get-Content -LiteralPath $meltBuilder -Raw
            $fixed = $text.Replace('#include "../undohelper.hpp"', '#include "undohelper.hpp"')
            if ($fixed -ne $text) { Set-Content -LiteralPath $meltBuilder -Value $fixed -Encoding UTF8 }
          }

      - name: Static safety checks before the long build
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $src = 'source\Syncut-Claude-Handoff'
          $ai = "$src\src\syncut"

          $required = @(
            "$ai\aiassistantwidget.cpp",
            "$ai\aiassistantwidget.h",
            "$src\data\icons\22-apps-syncut.png"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Required file missing: $file" }
          }

          $allAi = Get-ChildItem $ai -File -Recurse | Get-Content -Raw
          if ($allAi -match '\bemit\b') { throw 'Raw Qt emit keyword found. QT_NO_KEYWORDS requires Q_EMIT.' }
          if ($allAi -match 'generativelanguage|api\.openai|api\.nvidia|Gemini') { throw 'Cloud AI/API code found in local-only Syncut AI.' }
          if ($allAi -match 'https?://(?!127\.0\.0\.1|localhost)') { throw 'Non-local HTTP endpoint found in Syncut AI.' }

          $cpp = Get-Content "$ai\aiassistantwidget.cpp" -Raw
          if ($cpp -match 'QJsonObject\s*\{\{[^\r\n]*\+') {
            throw 'Risky QStringBuilder expression inside QJsonObject initializer found.'
          }
          if ($cpp -notmatch '127\.0\.0\.1:11434') { throw 'Ollama localhost detection is missing.' }
          if ($cpp -notmatch '127\.0\.0\.1:1234') { throw 'Bionic/LM Studio localhost detection is missing.' }
          if ($cpp -notmatch 'return true;') { throw 'Built-in local fallback availability check is missing.' }

          Write-Host 'Static Syncut/AI safety checks passed.'

      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            cmake
            ninja
            zip
            base-devel
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-extra-cmake-modules
            mingw-w64-ucrt-x86_64-kdenlive
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-icoutils
            mingw-w64-ucrt-x86_64-gdb

      - name: Configure CMake
        shell: msys2 {0}
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/source/Syncut-Claude-Handoff"
          BUILD="$GITHUB_WORKSPACE/build-windows"
          INSTALL="$GITHUB_WORKSPACE/dist/Syncut"
          rm -rf "$BUILD" "$INSTALL"
          mkdir -p "$BUILD" "$INSTALL"

          cmake -S "$SRC" -B "$BUILD" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$INSTALL" \
            -DBUILD_TESTING=OFF

          test -f "$BUILD/build.ninja"

      - name: Compile Syncut editor
        shell: msys2 {0}
        run: |
          set -euo pipefail
          BUILD="$GITHUB_WORKSPACE/build-windows"
          cmake --build "$BUILD" --target kdenlive -j2
          test -f "$BUILD/bin/syncut.exe"

      - name: Compile renderer and thumbnail plugin
        shell: msys2 {0}
        run: |
          set -euo pipefail
          BUILD="$GITHUB_WORKSPACE/build-windows"
          cmake --build "$BUILD" --target kdenlive_render -j2
          cmake --build "$BUILD" --target mltpreview -j2
          test -f "$BUILD/bin/kdenlive_render.exe"
          test -n "$(find "$BUILD" -type f -iname 'mltpreview.dll' | head -1)"

      - name: Install compiled application
        shell: msys2 {0}
        run: |
          set -euo pipefail
          BUILD="$GITHUB_WORKSPACE/build-windows"
          INSTALL="$GITHUB_WORKSPACE/dist/Syncut"
          cmake --install "$BUILD"
          test -f "$INSTALL/bin/syncut.exe"
          test -f "$INSTALL/bin/kdenlive_render.exe"

      - name: Deploy Qt QML MLT FFmpeg runtime
        shell: msys2 {0}
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/source/Syncut-Claude-Handoff"
          INSTALL="$GITHUB_WORKSPACE/dist/Syncut"

          DEPLOY=""
          for x in windeployqt6.exe windeployqt6 windeployqt.exe windeployqt; do
            if command -v "$x" >/dev/null 2>&1; then DEPLOY="$(command -v "$x")"; break; fi
          done
          [ -n "$DEPLOY" ] || { echo 'ERROR: windeployqt not found'; exit 20; }
          "$DEPLOY" --release --qmldir "$SRC" "$INSTALL/bin/syncut.exe"

          QMLROOT=""
          if command -v qtpaths6.exe >/dev/null 2>&1; then
            QMLROOT="$(qtpaths6.exe --query QT_INSTALL_QML 2>/dev/null | tr -d '\r' || true)"
          elif command -v qtpaths6 >/dev/null 2>&1; then
            QMLROOT="$(qtpaths6 --query QT_INSTALL_QML 2>/dev/null | tr -d '\r' || true)"
          fi
          if [ -z "$QMLROOT" ] || [ ! -d "$QMLROOT" ]; then
            for candidate in /ucrt64/share/qt6/qml /ucrt64/lib/qt6/qml /ucrt64/qml; do
              if [ -d "$candidate" ]; then QMLROOT="$candidate"; break; fi
            done
          fi
          [ -n "$QMLROOT" ] && [ -d "$QMLROOT" ] || { echo 'ERROR: Qt QML tree missing'; exit 21; }
          mkdir -p "$INSTALL/bin/qml"
          cp -R "$QMLROOT"/. "$INSTALL/bin/qml/"

          # Copy the external command-line tools FIRST.  They have their own
          # MinGW runtime dependencies, so they must be present before the
          # recursive DLL dependency pass below.
          MELT_SRC=""
          for candidate in /ucrt64/bin/melt.exe /ucrt64/bin/melt-7.exe /ucrt64/bin/mlt-melt.exe; do
            if [ -f "$candidate" ]; then MELT_SRC="$candidate"; break; fi
          done
          if [ -z "$MELT_SRC" ]; then
            MELT_SRC="$(find /ucrt64 -type f \( -iname 'melt.exe' -o -iname 'melt-7.exe' -o -iname 'mlt-melt.exe' \) | head -1 || true)"
          fi
          [ -n "$MELT_SRC" ] && [ -f "$MELT_SRC" ] || { echo 'ERROR: MLT melt missing'; exit 23; }
          cp -f "$MELT_SRC" "$INSTALL/bin/melt.exe"
          cp -f "$MELT_SRC" "$INSTALL/bin/melt-7.exe"

          for tool in ffmpeg.exe ffprobe.exe; do
            [ -f "/ucrt64/bin/$tool" ] || { echo "ERROR: $tool missing"; exit 24; }
            cp -f "/ucrt64/bin/$tool" "$INSTALL/bin/"
          done

          # Resolve the dependency closure AFTER syncut, renderer, melt,
          # ffmpeg and ffprobe are all in the package. Build 10.7 ran this
          # loop too early, so FFmpeg's MinGW DLLs were never copied.
          for pass in 1 2 3 4 5 6 7 8; do
            copied=0
            while IFS= read -r f; do
              while IFS= read -r dll; do
                [ -z "$dll" ] && continue
                base="$(basename "$dll")"
                if [ -f "$dll" ] && [ ! -f "$INSTALL/bin/$base" ]; then
                  cp -f "$dll" "$INSTALL/bin/$base"
                  echo "Copied dependency: $base"
                  copied=1
                fi
              done < <(ldd "$f" 2>/dev/null | awk '/=> \/ucrt64\// {print $3}' | sort -u)
            done < <(find "$INSTALL" -type f \( -iname '*.exe' -o -iname '*.dll' \))
            [ "$copied" -eq 0 ] && break
          done

          # Keep a dependency report in the Actions log.
          for tool in syncut.exe kdenlive_render.exe melt.exe ffmpeg.exe ffprobe.exe; do
            echo "===== ldd: $tool ====="
            ldd "$INSTALL/bin/$tool" 2>/dev/null || true
          done

          for d in /ucrt64/lib/mlt-7 /ucrt64/share/mlt-7 /ucrt64/share/mlt /ucrt64/share/frei0r-1 /ucrt64/share/kdenlive /ucrt64/share/kxmlgui6 /ucrt64/share/mime /ucrt64/share/icons; do
            if [ -d "$d" ]; then
              rel="${d#/ucrt64/}"
              mkdir -p "$INSTALL/$(dirname "$rel")"
              cp -R "$d" "$INSTALL/$(dirname "$rel")/" || true
            fi
          done

          ICON="$SRC/data/icons/syncut.ico"
          [ -f "$ICON" ] && cp -f "$ICON" "$INSTALL/syncut.ico"

          printf '%s\n' '[Paths]' 'Prefix=.' 'Plugins=.' 'Qml2Imports=qml' 'QmlImports=qml' 'Translations=translations' > "$INSTALL/bin/qt.conf"

      - name: Validate packaged runtime files
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'dist\Syncut'
          $bin = Join-Path $root 'bin'
          $required = @(
            'syncut.exe','kdenlive_render.exe','melt.exe','melt-7.exe','ffmpeg.exe','ffprobe.exe','qt.conf',
            'platforms\qwindows.dll','Qt6Core.dll','Qt6Gui.dll','Qt6Widgets.dll','Qt6Network.dll'
          )
          foreach ($rel in $required) {
            $p = Join-Path $bin $rel
            if (-not (Test-Path $p)) { throw "Packaged runtime file missing: $rel" }
          }
          $controls = Get-ChildItem (Join-Path $bin 'qml') -Filter qtquickcontrols2plugin.dll -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $controls) { throw 'qtquickcontrols2plugin.dll missing from packaged QML tree' }
          Write-Host "QtQuick Controls plugin: $($controls.FullName)"

      - name: Validate FFmpeg and MLT executables
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = Join-Path $env:GITHUB_WORKSPACE 'dist\Syncut\bin'
          $oldPath = $env:PATH
          $env:PATH = "$bin;$env:SystemRoot\System32;$env:SystemRoot"
          try {
            $tools = @(
              @{ Name = 'ffmpeg.exe'; Args = @('-version') },
              @{ Name = 'ffprobe.exe'; Args = @('-version') },
              @{ Name = 'melt.exe'; Args = @('-version') }
            )
            foreach ($tool in $tools) {
              $exe = Join-Path $bin $tool.Name
              Write-Host "Testing packaged $($tool.Name)..."
              try {
                $p = Start-Process -FilePath $exe -ArgumentList $tool.Args -WorkingDirectory $bin -Wait -PassThru -NoNewWindow
              } catch {
                Write-Host "Files in packaged bin:"
                Get-ChildItem $bin -File | Sort-Object Name | Select-Object -ExpandProperty Name
                throw "Packaged $($tool.Name) could not start: $($_.Exception.Message)"
              }
              if ($p.ExitCode -ne 0) { throw "Packaged $($tool.Name) failed with exit code $($p.ExitCode)" }
            }
          } finally {
            $env:PATH = $oldPath
          }

      - name: Smoke test portable package with NO optional AI runtime
        id: portable_smoke
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'dist\Syncut'
          $bin = Join-Path $root 'bin'
          $exe = Join-Path $bin 'syncut.exe'
          $clean = Join-Path $env:RUNNER_TEMP 'syncut-clean-profile-no-ai'
          if (Test-Path $clean) { Remove-Item $clean -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $clean | Out-Null

          $env:XDG_CONFIG_HOME = Join-Path $clean 'config'
          $env:XDG_CACHE_HOME = Join-Path $clean 'cache'
          $env:XDG_DATA_HOME = Join-Path $clean 'data'
          $env:QML2_IMPORT_PATH = Join-Path $bin 'qml'
          $env:QML_IMPORT_PATH = Join-Path $bin 'qml'
          $env:MLT_PREFIX = $root
          $env:PATH = "$bin;$env:SystemRoot\System32;$env:SystemRoot"

          $stdout = Join-Path $env:GITHUB_WORKSPACE 'syncut-portable-out.log'
          $stderr = Join-Path $env:GITHUB_WORKSPACE 'syncut-portable-err.log'
          $p = Start-Process -FilePath $exe -WorkingDirectory $bin -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Start-Sleep -Seconds 45
          if ($p.HasExited) {
            Write-Host "Syncut exited. Code: $($p.ExitCode)"
            if (Test-Path $stdout) { Get-Content $stdout -Tail 400 }
            if (Test-Path $stderr) { Get-Content $stderr -Tail 800 }
            throw "Portable Syncut smoke test failed: $($p.ExitCode)"
          }
          Write-Host 'Portable Syncut survived 45 seconds with no Ollama/Bionic service present.'
          Stop-Process -Id $p.Id -Force

      - name: Create portable ZIP
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Compress-Archive -Path 'dist\Syncut\*' -DestinationPath 'Syncut-Alpha-0.3-Windows-x64-Portable.zip' -Force
          if (-not (Test-Path 'Syncut-Alpha-0.3-Windows-x64-Portable.zip')) { throw 'Portable ZIP was not created' }
          if ((Get-Item 'Syncut-Alpha-0.3-Windows-x64-Portable.zip').Length -lt 10000000) { throw 'Portable ZIP is unexpectedly small' }

      - name: Install NSIS
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nsis -y --no-progress
          $candidates = @(
            "$env:ProgramFiles\NSIS\makensis.exe",
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            'C:\ProgramData\chocolatey\bin\makensis.exe'
          )
          $makensis = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $makensis) {
            $cmd = Get-Command makensis.exe -ErrorAction SilentlyContinue
            if ($cmd) { $makensis = $cmd.Source }
          }
          if (-not $makensis) { throw 'makensis.exe not found' }
          "MAKENSIS=$makensis" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create Windows installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'installer.nsi')) { throw 'installer.nsi missing' }
          & $env:MAKENSIS installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed: $LASTEXITCODE" }
          if (-not (Test-Path 'Syncut-Alpha-0.3-Windows-x64-Setup.exe')) { throw 'Installer was not produced' }

      - name: Silent-install the REAL installer on a clean runner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Resolve-Path 'Syncut-Alpha-0.3-Windows-x64-Setup.exe'
          $existing = Join-Path $env:LOCALAPPDATA 'Programs\Syncut'
          if (Test-Path $existing) { Remove-Item $existing -Recurse -Force }
          $p = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Silent installer failed: $($p.ExitCode)" }
          $installedExe = Join-Path $existing 'bin\syncut.exe'
          if (-not (Test-Path $installedExe)) { throw 'Installed syncut.exe is missing' }
          foreach ($rel in @('bin\melt.exe','bin\ffmpeg.exe','bin\platforms\qwindows.dll')) {
            if (-not (Test-Path (Join-Path $existing $rel))) { throw "Installed runtime missing: $rel" }
          }

      - name: Smoke test the INSTALLED application
        id: installed_smoke
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:LOCALAPPDATA 'Programs\Syncut'
          $bin = Join-Path $root 'bin'
          $exe = Join-Path $bin 'syncut.exe'
          $clean = Join-Path $env:RUNNER_TEMP 'syncut-clean-installed'
          if (Test-Path $clean) { Remove-Item $clean -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $clean | Out-Null
          $env:XDG_CONFIG_HOME = Join-Path $clean 'config'
          $env:XDG_CACHE_HOME = Join-Path $clean 'cache'
          $env:XDG_DATA_HOME = Join-Path $clean 'data'
          $env:QML2_IMPORT_PATH = Join-Path $bin 'qml'
          $env:QML_IMPORT_PATH = Join-Path $bin 'qml'
          $env:MLT_PREFIX = $root
          $env:PATH = "$bin;$env:SystemRoot\System32;$env:SystemRoot"
          $stdout = Join-Path $env:GITHUB_WORKSPACE 'syncut-installed-out.log'
          $stderr = Join-Path $env:GITHUB_WORKSPACE 'syncut-installed-err.log'
          $p = Start-Process -FilePath $exe -WorkingDirectory $bin -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Start-Sleep -Seconds 60
          if ($p.HasExited) {
            Write-Host "Installed Syncut exited. Code: $($p.ExitCode)"
            if (Test-Path $stdout) { Get-Content $stdout -Tail 400 }
            if (Test-Path $stderr) { Get-Content $stderr -Tail 800 }
            throw "Installed Syncut smoke test failed: $($p.ExitCode)"
          }
          Write-Host 'Installed Syncut survived 60 seconds with a clean PATH and clean profile.'
          Stop-Process -Id $p.Id -Force

      - name: Capture crash backtrace if a smoke test fails
        if: failure() && (steps.portable_smoke.outcome == 'failure' || steps.installed_smoke.outcome == 'failure')
        continue-on-error: true
        shell: msys2 {0}
        run: |
          INSTALL="$GITHUB_WORKSPACE/dist/Syncut"
          cd "$INSTALL/bin"
          export PATH="$INSTALL/bin:/ucrt64/bin:$PATH"
          export MLT_PREFIX="$INSTALL"
          export QML2_IMPORT_PATH="$INSTALL/bin/qml"
          export QML_IMPORT_PATH="$INSTALL/bin/qml"
          timeout 60s gdb -batch -ex 'set pagination off' -ex run -ex 'thread apply all bt full' --args "$INSTALL/bin/syncut.exe" > "$GITHUB_WORKSPACE/syncut-gdb.txt" 2>&1 || true

      - name: Upload diagnostics always
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Syncut-v10.8-Diagnostics
          path: |
            syncut-portable-out.log
            syncut-portable-err.log
            syncut-installed-out.log
            syncut-installed-err.log
            syncut-gdb.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload raw binaries always
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Syncut-v10.8-Raw-Binaries
          path: |
            build-windows/bin/syncut.exe
            build-windows/bin/kdenlive_render.exe
            build-windows/**/mltpreview.dll
          if-no-files-found: warn
          retention-days: 7

      - name: Upload final validated packages
        uses: actions/upload-artifact@v4
        with:
          name: Syncut-v10.8-VALIDATED-Windows
          path: |
            Syncut-Alpha-0.3-Windows-x64-Setup.exe
            Syncut-Alpha-0.3-Windows-x64-Portable.zip
          if-no-files-found: error
          retention-days: 14
