name: Build Syncut Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'syncut-source.part*'
      - '.github/workflows/build-syncut.yml'
      - 'installer.nsi'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 150

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reassemble Syncut source archive
        shell: cmd
        run: copy /b syncut-source.part01+syncut-source.part02+syncut-source.part03 syncut-source.zip

      - name: Extract and patch source archive
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path source) { Remove-Item source -Recurse -Force }
          Expand-Archive -LiteralPath syncut-source.zip -DestinationPath source -Force

          $src = 'source\Syncut-Claude-Handoff'
          if (-not (Test-Path "$src\CMakeLists.txt")) {
            throw 'Syncut source archive did not extract correctly.'
          }

          $meltBuilder = "$src\src\timeline2\model\builders\meltBuilder.cpp"
          if (Test-Path $meltBuilder) {
            $text = Get-Content -LiteralPath $meltBuilder -Raw
            $fixed = $text.Replace('#include "../undohelper.hpp"', '#include "undohelper.hpp"')
            if ($fixed -ne $text) {
              Set-Content -LiteralPath $meltBuilder -Value $fixed -Encoding UTF8
            }
          }

      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            cmake
            ninja
            zip
            base-devel
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-extra-cmake-modules
            mingw-w64-ucrt-x86_64-kdenlive

      - name: Configure and build Syncut
        shell: msys2 {0}
        run: |
          set -euo pipefail

          SRC="$GITHUB_WORKSPACE/source/Syncut-Claude-Handoff"
          BUILD="$GITHUB_WORKSPACE/build-windows"
          INSTALL="$GITHUB_WORKSPACE/dist/Syncut"

          rm -rf "$BUILD" "$INSTALL"
          mkdir -p "$BUILD" "$INSTALL"

          cmake -S "$SRC" -B "$BUILD" -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_INSTALL_PREFIX="$INSTALL"             -DBUILD_TESTING=OFF

          cmake --build "$BUILD" --target kdenlive -j2
          cmake --build "$BUILD" --target kdenlive_render -j2
          cmake --build "$BUILD" --target mltpreview -j2

          test -f "$BUILD/bin/syncut.exe"
          test -f "$BUILD/bin/kdenlive_render.exe"

      - name: Upload raw binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Syncut-Build-7-Raw-Binaries
          path: |
            build-windows/bin/syncut.exe
            build-windows/bin/kdenlive_render.exe
            build-windows/bin/kf6/thumbcreator/mltpreview.dll
          if-no-files-found: warn
          retention-days: 7

      - name: Install complete Syncut runtime
        shell: msys2 {0}
        run: |
          set -euo pipefail

          SRC="$GITHUB_WORKSPACE/source/Syncut-Claude-Handoff"
          BUILD="$GITHUB_WORKSPACE/build-windows"
          INSTALL="$GITHUB_WORKSPACE/dist/Syncut"

          cmake --install "$BUILD"

          test -f "$INSTALL/bin/syncut.exe"
          test -f "$INSTALL/bin/kdenlive_render.exe"

          if command -v windeployqt6 >/dev/null 2>&1; then
            windeployqt6 --release --qmldir "$SRC" "$INSTALL/bin/syncut.exe" || true
          elif command -v windeployqt >/dev/null 2>&1; then
            windeployqt --release --qmldir "$SRC" "$INSTALL/bin/syncut.exe" || true
          fi

          while IFS= read -r dll; do
            if [ -f "$dll" ]; then cp -n "$dll" "$INSTALL/bin/" || true; fi
          done < <(ldd "$INSTALL/bin/syncut.exe" | awk '/=> \/ucrt64\// {print $3}' | sort -u)

          for tool in ffmpeg.exe ffprobe.exe melt-7.exe; do
            if [ -f "/ucrt64/bin/$tool" ] && [ ! -f "$INSTALL/bin/$tool" ]; then
              cp "/ucrt64/bin/$tool" "$INSTALL/bin/"
            fi
          done

          for d in /ucrt64/lib/mlt-7 /ucrt64/share/mlt-7 /ucrt64/share/frei0r-1; do
            if [ -d "$d" ]; then
              rel="${d#/ucrt64/}"
              mkdir -p "$INSTALL/$(dirname "$rel")"
              cp -R "$d" "$INSTALL/$(dirname "$rel")/" || true
            fi
          done

          ICON="$(find "$SRC" -type f \( -iname 'syncut.ico' -o -iname '*syncut*.ico' \) | head -1 || true)"
          if [ -n "$ICON" ] && [ -f "$ICON" ]; then
            cp "$ICON" "$INSTALL/syncut.ico"
          fi

          printf '%s\n'             'Syncut Alpha 0.1'             ''             'Native Windows build of Syncut.'             ''             'Start with: bin\syncut.exe'             > "$INSTALL/README.txt"

      - name: Verify packaged runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'dist\Syncut'
          $bin = Join-Path $root 'bin'
          if (-not (Test-Path (Join-Path $bin 'syncut.exe'))) { throw 'syncut.exe missing' }
          if (-not (Test-Path (Join-Path $bin 'kdenlive_render.exe'))) { throw 'kdenlive_render.exe missing' }

      - name: Create portable ZIP
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Compress-Archive -Path 'dist\Syncut\*' -DestinationPath 'Syncut-Alpha-0.1-Windows-x64-Portable.zip' -Force

      - name: Install NSIS
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nsis -y --no-progress

          $candidates = @(
            "$env:ProgramFiles\NSIS\makensis.exe",
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            'C:\ProgramData\chocolatey\bin\makensis.exe'
          )

          $makensis = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1

          if (-not $makensis) {
            $cmd = Get-Command makensis.exe -ErrorAction SilentlyContinue
            if ($cmd) { $makensis = $cmd.Source }
          }

          if (-not $makensis) { throw 'makensis.exe not found' }

          "MAKENSIS=$makensis" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create Windows installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'installer.nsi')) { throw 'installer.nsi missing from repository root' }
          if (-not $env:MAKENSIS) { throw 'MAKENSIS path missing' }

          & $env:MAKENSIS installer.nsi

          if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path 'Syncut-Alpha-0.1-Windows-x64-Setup.exe')) { throw 'Installer was not produced' }

      - name: Upload final Syncut installer
        uses: actions/upload-artifact@v4
        with:
          name: Syncut-Windows-Installer-Build-7
          path: |
            Syncut-Alpha-0.1-Windows-x64-Setup.exe
            Syncut-Alpha-0.1-Windows-x64-Portable.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Syncut-Build-7-Diagnostics
          path: |
            installer.nsi
            dist/Syncut/**
          if-no-files-found: warn
          retention-days: 7
