name: Build Syncut Windows - v10.11 Runtime Validation

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'syncut-source.part*'
      - '.github/workflows/build-syncut.yml'
      - '.github/scripts/v10.10/**'
      - 'installer.nsi'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate CI helper syntax
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem '.github\scripts\v10.10' -Filter '*.ps1' -File | ForEach-Object {
            $null = [scriptblock]::Create((Get-Content -LiteralPath $_.FullName -Raw))
            Write-Host "PowerShell syntax OK: $($_.Name)"
          }
          & 'C:\Program Files\Git\bin\bash.exe' -n '.github/scripts/v10.10/build-kio-probe.sh'
          if ($LASTEXITCODE -ne 0) { throw 'build-kio-probe.sh has invalid shell syntax.' }
          & 'C:\Program Files\Git\bin\bash.exe' -n '.github/scripts/v10.10/deploy-runtime.sh'
          if ($LASTEXITCODE -ne 0) { throw 'deploy-runtime.sh has invalid shell syntax.' }

      - name: Verify source parts and reconstruct archive
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = @('syncut-source.part01','syncut-source.part02','syncut-source.part03')
          foreach ($part in $parts) {
            if (-not (Test-Path -LiteralPath $part)) { throw "Missing $part" }
            $size = (Get-Item -LiteralPath $part).Length
            if ($size -lt 1000000) { throw "$part is unexpectedly small: $size bytes" }
            Write-Host "$part = $size bytes"
          }
          cmd /c copy /b syncut-source.part01+syncut-source.part02+syncut-source.part03 syncut-source.zip
          if ($LASTEXITCODE -ne 0) { throw 'Failed to reconstruct syncut-source.zip' }
          if (-not (Test-Path -LiteralPath 'syncut-source.zip')) { throw 'syncut-source.zip was not created' }
          $hash = (Get-FileHash -LiteralPath 'syncut-source.zip' -Algorithm SHA256).Hash
          Write-Host "Reconstructed source SHA256: $hash"

      - name: Validate source and apply deterministic fixes
        shell: powershell
        run: |
          & '.\.github\scripts\v10.10\validate-source.ps1' -Archive 'syncut-source.zip' -Destination 'source'

      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            cmake
            ninja
            zip
            base-devel
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-extra-cmake-modules
            mingw-w64-ucrt-x86_64-kdenlive
            mingw-w64-ucrt-x86_64-kio
            mingw-w64-ucrt-x86_64-kservice
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-icoutils
            mingw-w64-ucrt-x86_64-gdb

      - name: Record exact toolchain and runtime versions
        shell: msys2 {0}
        run: |
          set -euo pipefail
          {
            echo "gcc=$(gcc --version | head -1)"
            echo "cmake=$(cmake --version | head -1)"
            echo "ninja=$(ninja --version)"
            pacman -Q \
              mingw-w64-ucrt-x86_64-kdenlive \
              mingw-w64-ucrt-x86_64-kio \
              mingw-w64-ucrt-x86_64-kservice \
              mingw-w64-ucrt-x86_64-kcoreaddons \
              mingw-w64-ucrt-x86_64-qt6-base \
              mingw-w64-ucrt-x86_64-mlt \
              mingw-w64-ucrt-x86_64-ffmpeg
          } | tee "$GITHUB_WORKSPACE/runtime-versions.txt"

      - name: Configure CMake
        shell: msys2 {0}
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/source/Syncut-Claude-Handoff"
          BUILD="$GITHUB_WORKSPACE/build-windows"
          INSTALL="$GITHUB_WORKSPACE/dist/Syncut"
          rm -rf "$BUILD" "$INSTALL"
          mkdir -p "$BUILD" "$INSTALL"
          cmake -S "$SRC" -B "$BUILD" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$INSTALL" \
            -DBUILD_TESTING=OFF
          test -f "$BUILD/build.ninja"

      - name: Compile Syncut editor
        shell: msys2 {0}
        run: |
          set -euo pipefail
          BUILD="$GITHUB_WORKSPACE/build-windows"
          cmake --build "$BUILD" --target kdenlive -j2 2>&1 | tee "$GITHUB_WORKSPACE/compile-syncut.log"
          test -f "$BUILD/bin/syncut.exe"

      - name: Compile renderer and thumbnail plugin
        shell: msys2 {0}
        run: |
          set -euo pipefail
          BUILD="$GITHUB_WORKSPACE/build-windows"
          cmake --build "$BUILD" --target kdenlive_render -j2 2>&1 | tee "$GITHUB_WORKSPACE/compile-renderer.log"
          cmake --build "$BUILD" --target mltpreview -j2 2>&1 | tee "$GITHUB_WORKSPACE/compile-thumbnailer.log"
          test -f "$BUILD/bin/kdenlive_render.exe"
          test -n "$(find "$BUILD" -type f -iname 'mltpreview.dll' | head -1)"

      - name: Install compiled application
        shell: msys2 {0}
        run: |
          set -euo pipefail
          BUILD="$GITHUB_WORKSPACE/build-windows"
          INSTALL="$GITHUB_WORKSPACE/dist/Syncut"
          cmake --install "$BUILD"
          test -f "$INSTALL/bin/syncut.exe"
          test -f "$INSTALL/bin/kdenlive_render.exe"

      - name: Build independent KIO local-file protocol probe
        shell: msys2 {0}
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/v10.10/build-kio-probe.sh"

      - name: Deploy Qt KDE KIO MLT and FFmpeg runtime
        shell: msys2 {0}
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/v10.10/deploy-runtime.sh" 2>&1 | tee "$GITHUB_WORKSPACE/deploy-runtime.log"

      - name: Validate packaged runtime inventory
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'dist\Syncut'
          $bin = Join-Path $root 'bin'
          $required = @(
            'syncut.exe','kdenlive_render.exe','kioworker.exe','kbuildsycoca6.exe',
            'melt.exe','melt-7.exe','ffmpeg.exe','ffprobe.exe','qt.conf','qt6.conf',
            'platforms\qwindows.dll','Qt6Core.dll','Qt6Gui.dll','Qt6Widgets.dll','Qt6Network.dll',
            'kf6\kio\kio_file.dll','data\kf6\jsonschema\kpluginmetadata.schema.json'
          )
          foreach ($rel in $required) {
            $path = Join-Path $bin $rel
            if (-not (Test-Path -LiteralPath $path)) { throw "Packaged runtime file missing: $rel" }
          }
          $controls = Get-ChildItem (Join-Path $bin 'qml') -Filter 'qtquickcontrols2plugin.dll' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $controls) { throw 'qtquickcontrols2plugin.dll missing from packaged QML tree.' }
          $mltPlugin = Get-ChildItem $root -Filter 'libmlt*.dll' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $mltPlugin) { throw 'MLT runtime plugins are missing.' }
          $qtConf = Get-Content -LiteralPath (Join-Path $bin 'qt.conf') -Raw
          foreach ($line in @('Prefix=..','LibraryExecutables=bin','Plugins=bin','Data=bin/data')) {
            if ($qtConf -notmatch [regex]::Escape($line)) { throw "qt.conf is missing: $line" }
          }
          Write-Host "QtQuick Controls plugin: $($controls.FullName)"
          Write-Host "MLT plugin sample: $($mltPlugin.FullName)"

      - name: Audit required PE dependencies
        shell: msys2 {0}
        run: |
          set -euo pipefail
          INSTALL="$GITHUB_WORKSPACE/dist/Syncut"
          REPORT="$GITHUB_WORKSPACE/pe-dependency-audit.txt"
          : > "$REPORT"

          # Do not fail on Windows API-set forwarders. They are supplied by
          # Windows/UCRT and MSYS2 ldd can report them as "not found" even
          # though they are valid system dependencies on the target machine.
          is_windows_api_set() {
            case "$1" in
              api-ms-win-*|ext-ms-win-*) return 0 ;;
              *) return 1 ;;
            esac
          }

          audit_one() {
            file="$1"
            label="$2"
            if [ ! -f "$file" ]; then
              echo "MISSING REQUIRED PE: $label -> $file" | tee -a "$REPORT"
              return 1
            fi

            unresolved=0
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              dll="$(printf '%s\n' "$line" | awk '{print $1}')"
              if is_windows_api_set "$dll"; then
                echo "SYSTEM API-SET (expected): $label -> $dll" >> "$REPORT"
                continue
              fi
              echo "UNRESOLVED REQUIRED DEPENDENCY: $label -> $line" | tee -a "$REPORT"
              unresolved=1
            done < <(ldd "$file" 2>/dev/null | grep -i 'not found' || true)

            if [ "$unresolved" -ne 0 ]; then
              return 1
            fi
            echo "OK: $label" >> "$REPORT"
            return 0
          }

          failed=0
          audit_one "$INSTALL/bin/syncut.exe" 'Syncut editor' || failed=1
          audit_one "$INSTALL/bin/kdenlive_render.exe" 'renderer' || failed=1
          audit_one "$INSTALL/bin/kioworker.exe" 'KIO worker host' || failed=1
          audit_one "$INSTALL/bin/kbuildsycoca6.exe" 'KService cache builder' || failed=1
          audit_one "$INSTALL/bin/melt.exe" 'MLT melt' || failed=1
          audit_one "$INSTALL/bin/ffmpeg.exe" 'FFmpeg' || failed=1
          audit_one "$INSTALL/bin/ffprobe.exe" 'FFprobe' || failed=1
          audit_one "$INSTALL/bin/platforms/qwindows.dll" 'Qt Windows platform plugin' || failed=1
          audit_one "$INSTALL/bin/kf6/kio/kio_file.dll" 'KIO file worker' || failed=1

          controls="$(find "$INSTALL/bin/qml" -type f -iname 'qtquickcontrols2plugin.dll' | head -1 || true)"
          if [ -n "$controls" ]; then
            audit_one "$controls" 'QtQuick Controls plugin' || failed=1
          else
            echo 'MISSING REQUIRED PE: QtQuick Controls plugin' | tee -a "$REPORT"
            failed=1
          fi

          # Record unresolved dependencies in optional, unused plugin trees as
          # diagnostics only. The functional tests below exercise the actual
          # KIO, FFmpeg/MLT and GUI paths that Syncut needs to run.
          echo '===== OPTIONAL PLUGIN DIAGNOSTICS =====' >> "$REPORT"
          while IFS= read -r file; do
            missing="$(ldd "$file" 2>/dev/null | grep -i 'not found' || true)"
            [ -z "$missing" ] && continue
            filtered=''
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              dll="$(printf '%s\n' "$line" | awk '{print $1}')"
              is_windows_api_set "$dll" && continue
              filtered="${filtered}${line}\n"
            done <<< "$missing"
            if [ -n "$filtered" ]; then
              echo "OPTIONAL: $file" >> "$REPORT"
              printf '%b' "$filtered" >> "$REPORT"
            fi
          done < <(find "$INSTALL/bin/kf6/sonnet" "$INSTALL/bin/qml/QtQuick3D" -type f \( -iname '*.exe' -o -iname '*.dll' \) -print 2>/dev/null || true)

          if [ "$failed" -ne 0 ]; then
            echo 'One or more REQUIRED Syncut runtime components have unresolved DLL dependencies.'
            cat "$REPORT"
            exit 30
          fi

          echo 'All REQUIRED Syncut runtime dependencies resolved.' | tee -a "$REPORT"

      - name: Test portable KIO file protocol directly
        shell: powershell
        run: |
          & '.\.github\scripts\v10.10\test-kio-probe.ps1' `
            -Root (Join-Path $env:GITHUB_WORKSPACE 'dist\Syncut') `
            -ProbeSource (Join-Path $env:GITHUB_WORKSPACE 'kio-probe-build\syncut-kio-probe.exe') `
            -Label 'portable'

      - name: Validate FFmpeg FFprobe MLT and actual media processing
        shell: powershell
        run: |
          & '.\.github\scripts\v10.10\test-media-runtime.ps1' -Root (Join-Path $env:GITHUB_WORKSPACE 'dist\Syncut')

      - name: Smoke test portable GUI and reject visible error dialogs
        id: portable_smoke
        shell: powershell
        run: |
          & '.\.github\scripts\v10.10\test-gui.ps1' `
            -Root (Join-Path $env:GITHUB_WORKSPACE 'dist\Syncut') `
            -Label 'portable-no-ai' `
            -Seconds 75

      - name: Create portable ZIP
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Compress-Archive -Path 'dist\Syncut\*' -DestinationPath 'Syncut-Alpha-0.3-Windows-x64-Portable.zip' -Force
          if (-not (Test-Path -LiteralPath 'Syncut-Alpha-0.3-Windows-x64-Portable.zip')) { throw 'Portable ZIP was not created.' }
          if ((Get-Item -LiteralPath 'Syncut-Alpha-0.3-Windows-x64-Portable.zip').Length -lt 10000000) { throw 'Portable ZIP is unexpectedly small.' }

      - name: Install NSIS
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nsis -y --no-progress
          $candidates = @(
            "$env:ProgramFiles\NSIS\makensis.exe",
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            'C:\ProgramData\chocolatey\bin\makensis.exe'
          )
          $makensis = $candidates | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1
          if (-not $makensis) {
            $command = Get-Command 'makensis.exe' -ErrorAction SilentlyContinue
            if ($command) { $makensis = $command.Source }
          }
          if (-not $makensis) { throw 'makensis.exe not found.' }
          "MAKENSIS=$makensis" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create Windows installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath 'installer.nsi')) { throw 'installer.nsi missing.' }
          & $env:MAKENSIS 'installer.nsi'
          if ($LASTEXITCODE -ne 0) { throw "makensis failed: $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath 'Syncut-Alpha-0.3-Windows-x64-Setup.exe')) { throw 'Installer was not produced.' }
          if ((Get-Item -LiteralPath 'Syncut-Alpha-0.3-Windows-x64-Setup.exe').Length -lt 10000000) { throw 'Installer is unexpectedly small.' }

      - name: Silent-install the real installer on a clean runner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Resolve-Path -LiteralPath 'Syncut-Alpha-0.3-Windows-x64-Setup.exe'
          $installRoot = Join-Path $env:LOCALAPPDATA 'Programs\Syncut'
          if (Test-Path -LiteralPath $installRoot) { Remove-Item -LiteralPath $installRoot -Recurse -Force }
          $process = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Silent installer failed: $($process.ExitCode)" }
          foreach ($rel in @(
            'bin\syncut.exe','bin\kioworker.exe','bin\kf6\kio\kio_file.dll',
            'bin\melt.exe','bin\ffmpeg.exe','bin\platforms\qwindows.dll','Uninstall.exe'
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $installRoot $rel))) { throw "Installed runtime missing: $rel" }
          }

      - name: Test installed KIO file protocol directly
        shell: powershell
        run: |
          & '.\.github\scripts\v10.10\test-kio-probe.ps1' `
            -Root (Join-Path $env:LOCALAPPDATA 'Programs\Syncut') `
            -ProbeSource (Join-Path $env:GITHUB_WORKSPACE 'kio-probe-build\syncut-kio-probe.exe') `
            -Label 'installed'

      - name: Smoke test the installed application
        id: installed_smoke
        shell: powershell
        run: |
          & '.\.github\scripts\v10.10\test-gui.ps1' `
            -Root (Join-Path $env:LOCALAPPDATA 'Programs\Syncut') `
            -Label 'installed' `
            -Seconds 75

      - name: Reinstall over a running copy and validate upgrade recovery
        id: upgrade_smoke
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:LOCALAPPDATA 'Programs\Syncut'
          $bin = Join-Path $root 'bin'
          $exe = Join-Path $bin 'syncut.exe'
          $setup = Resolve-Path -LiteralPath 'Syncut-Alpha-0.3-Windows-x64-Setup.exe'
          $env:PATH = "$bin;$env:SystemRoot\System32;$env:SystemRoot"
          $env:MLT_PREFIX = $root
          $env:MLT_REPOSITORY = Join-Path $root 'lib\mlt-7'
          $env:MLT_DATA = Join-Path $root 'share\mlt-7'
          $running = Start-Process -FilePath $exe -WorkingDirectory $bin -PassThru
          Start-Sleep -Seconds 12
          $running.Refresh()
          if ($running.HasExited) { throw 'Syncut exited before the upgrade test.' }
          $installer = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Upgrade installer failed: $($installer.ExitCode)" }
          Start-Sleep -Seconds 2
          $running.Refresh()
          if (-not $running.HasExited) {
            Stop-Process -Id $running.Id -Force -ErrorAction SilentlyContinue
            throw 'Installer did not close the running Syncut process before replacing files.'
          }
          foreach ($rel in @('bin\syncut.exe','bin\kioworker.exe','bin\kf6\kio\kio_file.dll')) {
            if (-not (Test-Path -LiteralPath (Join-Path $root $rel))) { throw "Upgrade removed required file: $rel" }
          }
          & '.\.github\scripts\v10.10\test-kio-probe.ps1' `
            -Root $root `
            -ProbeSource (Join-Path $env:GITHUB_WORKSPACE 'kio-probe-build\syncut-kio-probe.exe') `
            -Label 'after-upgrade'
          & '.\.github\scripts\v10.10\test-gui.ps1' -Root $root -Label 'after-upgrade' -Seconds 45

      - name: Validate uninstaller
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:LOCALAPPDATA 'Programs\Syncut'
          $uninstall = Join-Path $root 'Uninstall.exe'
          if (-not (Test-Path -LiteralPath $uninstall)) { throw 'Uninstaller is missing.' }
          $process = Start-Process -FilePath $uninstall -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Uninstaller failed: $($process.ExitCode)" }
          Start-Sleep -Seconds 2
          if (Test-Path -LiteralPath (Join-Path $root 'bin\syncut.exe')) { throw 'Uninstaller left syncut.exe behind.' }

      - name: Capture crash backtrace if a GUI smoke test fails
        if: failure() && (steps.portable_smoke.outcome == 'failure' || steps.installed_smoke.outcome == 'failure' || steps.upgrade_smoke.outcome == 'failure')
        continue-on-error: true
        shell: msys2 {0}
        run: |
          INSTALL="$GITHUB_WORKSPACE/dist/Syncut"
          cd "$INSTALL/bin"
          export PATH="$INSTALL/bin:/ucrt64/bin:$PATH"
          export MLT_PREFIX="$INSTALL"
          export MLT_REPOSITORY="$INSTALL/lib/mlt-7"
          export MLT_DATA="$INSTALL/share/mlt-7"
          timeout 60s gdb -batch -ex 'set pagination off' -ex run -ex 'thread apply all bt full' --args "$INSTALL/bin/syncut.exe" > "$GITHUB_WORKSPACE/syncut-gdb.txt" 2>&1 || true

      - name: Upload diagnostics always
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Syncut-v10.10-Diagnostics
          path: |
            runtime-versions.txt
            compile-syncut.log
            compile-renderer.log
            compile-thumbnailer.log
            deploy-runtime.log
            pe-dependency-audit.txt
            kio-probe-*-out.log
            kio-probe-*-err.log
            melt-query.log
            melt-query-error.log
            syncut-*-out.log
            syncut-*-err.log
            syncut-*-windows.log
            syncut-gdb.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload raw binaries always
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Syncut-v10.10-Raw-Binaries
          path: |
            build-windows/bin/syncut.exe
            build-windows/bin/kdenlive_render.exe
            build-windows/**/mltpreview.dll
            kio-probe-build/syncut-kio-probe.exe
          if-no-files-found: warn
          retention-days: 7

      - name: Upload final fully validated packages
        uses: actions/upload-artifact@v4
        with:
          name: Syncut-v10.10-FULLY-VALIDATED-Windows
          path: |
            Syncut-Alpha-0.3-Windows-x64-Setup.exe
            Syncut-Alpha-0.3-Windows-x64-Portable.zip
          if-no-files-found: error
          retention-days: 14
