name: Notify Syncut build

on:
  workflow_run:
    workflows: ["Build Syncut Windows - v11 Stable Recovery"]
    types: [completed]

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send GitHub notification
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const ok = run.conclusion === 'success';
            const title = ok ? '✅ Syncut Windows build succeeded' : '❌ Syncut Windows build failed';
            const body = title + '\n\nWorkflow: ' + run.name + '\nRun: #' + run.run_number + '\nCommit: ' + run.head_sha.slice(0, 7) + '\nDetails: ' + run.html_url;
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: run.head_sha,
              body
            });
